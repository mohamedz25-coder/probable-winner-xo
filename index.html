<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Tic Tac Toe — Unbeatable AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="header">
      <p class="eyebrow">CLASSIC GAME</p>
      <h1>Tic <span>Tac</span> Toe</h1>
      <p class="subtitle">Can you beat the unbeatable AI?</p>
    </header>

    <section class="scoreboard" aria-label="Score">
      <div class="score active" id="human-score-card">
        <span class="score-symbol">X</span>
        <span class="score-label">YOU</span>
        <strong id="human-score">0</strong>
      </div>
      <div class="score" id="draw-score-card">
        <span class="score-symbol draw-symbol">＝</span>
        <span class="score-label">DRAWS</span>
        <strong id="draw-score">0</strong>
      </div>
      <div class="score" id="ai-score-card">
        <span class="score-symbol">O</span>
        <span class="score-label">AI</span>
        <strong id="ai-score">0</strong>
      </div>
    </section>

    <div class="status" id="status" role="status" aria-live="polite">
      Your turn — choose a square
    </div>

    <section class="board" id="board" aria-label="Tic Tac Toe board">
      <button class="cell" data-index="0" aria-label="Top left"></button>
      <button class="cell" data-index="1" aria-label="Top middle"></button>
      <button class="cell" data-index="2" aria-label="Top right"></button>
      <button class="cell" data-index="3" aria-label="Middle left"></button>
      <button class="cell" data-index="4" aria-label="Center"></button>
      <button class="cell" data-index="5" aria-label="Middle right"></button>
      <button class="cell" data-index="6" aria-label="Bottom left"></button>
      <button class="cell" data-index="7" aria-label="Bottom middle"></button>
      <button class="cell" data-index="8" aria-label="Bottom right"></button>
    </section>

    <button class="restart" id="restart">↻ <span>New game</span></button>
    <p class="hint">You play as <b>X</b>. The AI plays as <b>O</b>.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
